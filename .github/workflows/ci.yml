name: Periksa MVP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check frontend/app.js && node --check frontend/chart.js
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t geter-id:ci .
      - name: Uji container
        run: |
          docker run -d --name geter -p 8000:8000 geter-id:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8000/ > /dev/null
          docker logs geter
