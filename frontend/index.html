<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="GETER IDX Dashboard Saham Indonesia"
    >

    <title>
        GETER IDX
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

<header>

    <div>

        <b>
            GETER IDX
        </b>

        <small>
            Indonesia Stock Intelligence
        </small>

    </div>


    <span id="status">
        Connecting...
    </span>

</header>


<main>

    <section class="hero">

        <p>
            INDONESIA EQUITY DASHBOARD
        </p>

        <h1>
            Data saham Indonesia
            langsung dari IDX engine.
        </h1>

    </section>


    <section
        id="market"
        class="cards"
    >

        <div class="card">

            <small>
                MARKET
            </small>

            <strong>
                Memuat...
            </strong>

        </div>

    </section>


    <section class="panel">

        <div class="search">

            <input
                id="symbol"
                value="BBCA"
                maxlength="12"
                placeholder="BBCA"
            >

            <button id="go">
                Analisis
            </button>

        </div>


        <p id="msg"></p>


        <div
            id="quote"
            class="result"
        ></div>

    </section>


    <section class="grid">

        <div class="panel">

            <h3>
                Technical
            </h3>

            <pre id="tech">Pilih saham.</pre>

        </div>


        <div class="panel">

            <h3>
                History 1 Bulan
            </h3>

            <pre id="history">Pilih saham.</pre>

        </div>

    </section>

</main>


<script src="/app.js"></script>

</body>

</html>
